name: Build NOX TWEAK (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NoxTweak.sln

      - name: Build (Release)
        run: dotnet build NoxTweak.sln -c Release --no-restore

      - name: Self-tests
        run: dotnet run --project src/NoxTweak.SelfTest -c Release --no-build

      - name: Publish self-contained win-x64
        run: >
          dotnet publish src/NoxTweak.App/NoxTweak.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NoxTweak-win-x64
          path: publish/NoxTweak.exe
          if-no-files-found: error
